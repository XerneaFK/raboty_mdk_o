<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ресторан{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --restaurant-green: #173b2c; --restaurant-accent: #26734d; }
        body { background: #f6f8f6; color: #212529; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar, footer { background: var(--restaurant-green); }
        .navbar-brand, .navbar .nav-link { color: #fff !important; }
        .navbar .nav-link:hover { color: #cce8d8 !important; }
        .hero { background: linear-gradient(135deg, #173b2c, #26734d); color: white; border-radius: 1.25rem; padding: 4rem 2rem; }
        .btn-success { background: var(--restaurant-accent); border-color: var(--restaurant-accent); }
        .btn-success:hover { background: #1d5b3c; border-color: #1d5b3c; }
        .food-card { border: 0; border-radius: 1rem; box-shadow: 0 5px 22px rgba(20, 50, 35, .08); height: 100%; }
        .food-card .card-body { padding: 1.5rem; }
        main { flex: 1; }
        footer { color: white; padding: 1.25rem; margin-top: 3rem; }
        .form-control, .form-select { border-radius: .7rem; padding: .7rem .9rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Ресторан</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu" aria-controls="mainMenu" aria-expanded="false" aria-label="Открыть меню">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainMenu">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Главная</a>
                <a class="nav-link" href="/menu/">Меню</a>
                <a class="nav-link" href="/orders/create/">Оформить заказ</a>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4">
    {% block content %}{% endblock %}
</main>

<footer class="text-center">
    <div class="container">Ресторан — вкусная еда и хорошее настроение</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
